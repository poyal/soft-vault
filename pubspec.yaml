name: soft_vault
description: Local desktop media library.
publish_to: none
version: 0.3.2
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  archive: ^4.6.0
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_selector: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.8
  ffi: ^2.2.0
  sqflite_common_ffi: ^2.4.0
  window_manager: ^0.5.1
  xml: ^7.0.1
  flutter_svg: ^2.2.3
  cryptography: 2.9.0
dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/update-config.json
    - design/assets/app-icon.png
